<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recordshower</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!--header
        user 
        stats-->
        <h1>CodeTrackr</h1>
        <div class="user_container">
            <p>Enter your user name below</p>
            <div class="user_input_container">
                <input type="text" placeholder="enter your username here" id="user_input">
                <button id="srch">Search</button>
            </div>
        </div>
        <div class="stats_container">
            <div class="progress">
                <div class="progress_item ">
                    <div class="easy_progress circle">
                        <span id="easyp"></span>
                        <p>Easy</p>
                    </div>
                </div>
                <div class="progress_item ">
                    <div class="medium_progress circle">
                        <span id="mediump"></span>
                        <p>Medium</p>
                    </div>
                </div>
                <div class="progress_item ">
                    <div class="hard_progress circle">
                        <span id="hardp"></span>
                        <p>Hard</p>
                    </div>
                </div>
            </div>
            <div class="stats_card">
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
